[package]
name = "agentguard"
version = "0.1.0"
edition = "2021"
description = "Local AI coding agent firewall and shadow workspace sandbox"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
http = "1.1"
mime_guess = "2.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.42", features = ["full"] }
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
uuid = { version = "1.11", features = ["v4", "serde"] }
